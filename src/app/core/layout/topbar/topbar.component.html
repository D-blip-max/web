<header class="topbar glass-card">
  <div class="topbar-left">
    <a routerLink="/dashboard" class="brand-logo">
      <img src="/logo.png" alt="FICCT STORE" class="brand-logo-topbar-img" />
      <span class="brand-name">FICCT STORE</span>
    </a>
  </div>

  <div class="topbar-right">
    @if (currentUser(); as user) {
      <div class="user-profile">
        <div class="user-avatar">
          <i class="bi bi-person-circle"></i>
        </div>
        <div class="user-info">
          <span class="user-name">{{ user.full_name }}</span>
          <span class="user-email">{{ user.email }}</span>
        </div>
      </div>
    }

    <!-- Dark Mode Toggle -->
    <button (click)="onToggleDark()" class="btn-icon btn-dark-toggle" [title]="isDark() ? 'Modo claro' : 'Modo oscuro'">
      @if (isDark()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>

    <button (click)="onLogout()" class="btn-icon btn-logout" title="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="logout-text">Salir</span>
    </button>

    <button (click)="onToggleNav()" class="btn-icon btn-hamburger" title="Menú de módulos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>
</header>
