<div class="auth-container">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <div class="brand-logo-container">
        <img src="/logo.png" alt="FICCT STORE" class="brand-logo-img" />
      </div>
      <h1 class="auth-title">Bienvenido de nuevo</h1>
      <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-input"
          [class.is-invalid]="isFieldInvalid('email')"
          placeholder="tu@email.com"
          autocomplete="email"
        />
        @if (isFieldInvalid('email')) {
          <span class="error-text">Ingresa un correo electrónico válido</span>
        }
      </div>

      <div class="form-group">
        <div class="label-row">
          <label class="form-label" for="password">Contraseña</label>
        </div>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-input"
          [class.is-invalid]="isFieldInvalid('password')"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        @if (isFieldInvalid('password')) {
          <span class="error-text">La contraseña es obligatoria</span>
        }
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-full mt-4"
        [disabled]="isLoading() || loginForm.invalid"
      >
        @if (isLoading()) {
          <div class="spinner"></div>
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar sesión</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes una cuenta? <a routerLink="/auth/register">Regístrate aquí</a></p>
    </div>
  </div>
</div>
