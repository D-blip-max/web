<div class="modal-overlay">
  <div class="modal-card glass-card">
    <div class="modal-header">
      <h3>{{ role ? 'Editar Rol' : 'Crear Nuevo Rol' }}</h3>
      <button (click)="onCancel()" class="btn-close" title="Cerrar">&times;</button>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="role-form">
      <div class="form-group">
        <label class="form-label" for="role_name">Nombre del Rol *</label>
        <input
          id="role_name"
          type="text"
          formControlName="name"
          class="form-control"
          placeholder="ej. editor, cajero, supervisor"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="role_description">Descripción</label>
        <textarea
          id="role_description"
          formControlName="description"
          class="form-control"
          rows="3"
          placeholder="Descripción de los privilegios o propósito del rol"
        ></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" (click)="onCancel()" class="btn btn-secondary">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving() || form.invalid">
          @if (isSaving()) {
            <div class="spinner"></div>
            <span>Guardando...</span>
          } @else {
            <span>{{ role ? 'Guardar Cambios' : 'Crear Rol' }}</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
