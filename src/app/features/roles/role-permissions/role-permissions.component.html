<div [class.modal-overlay]="!isStandaloneRoute()" [class.standalone-container]="isStandaloneRoute()">
  <div class="modal-card glass-card modal-lg">
    <div class="modal-header">
      <div class="d-flex align-items-center gap-2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px" class="text-primary">
          <path d="M21 2l-2 2m-1.5 6.1L13 14.5l-2-2-4 4 1.5 1.5-2.5 2.5L2 19l1.5-4 2.5-2.5 1.5 1.5 4-4-2-2 4.4-4.5A6.5 6.5 0 1 1 21 2z"/>
        </svg>
        <h3 class="m-0">Permisos del Rol: <span class="text-primary">{{ roleData()?.name }}</span></h3>
      </div>
      <button (click)="onCancel()" class="btn-close" title="Volver / Cerrar">&times;</button>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (isLoading()) {
      <div class="loading-state">
        <div class="spinner"></div>
        <p class="text-muted mt-2">Cargando matriz de permisos...</p>
      </div>
    } @else {
      <div class="permissions-matrix">
        @for (group of groupedPermissions(); track group.module) {
          <div class="module-section">
            <div class="module-header">
              <label class="checkbox-container module-title">
                <input
                  type="checkbox"
                  [checked]="isModuleAllSelected(group)"
                  (change)="toggleModule(group)"
                />
                <span class="checkmark"></span>
                <strong>Módulo: {{ group.module }}</strong>
              </label>
            </div>

            <div class="permissions-grid">
              @for (perm of group.permissions; track perm.id) {
                <label
                  class="checkbox-container permission-item"
                  [class.disabled-checkbox]="roleData()?.name === 'admin' && perm.code === 'roles.update'"
                >
                  <input
                    type="checkbox"
                    [checked]="isPermissionSelected(perm.id)"
                    [disabled]="roleData()?.name === 'admin' && perm.code === 'roles.update'"
                    (change)="togglePermission(perm)"
                  />
                  <span class="checkmark"></span>
                  <div class="perm-info">
                    <span class="perm-code">{{ perm.code }}</span>
                    <span class="perm-desc">{{ perm.description || perm.path }}</span>
                  </div>
                </label>
              }
            </div>
          </div>
        }
      </div>

      <div class="modal-footer">
        <button type="button" (click)="onCancel()" class="btn btn-secondary">
          Cancelar
        </button>
        <button type="button" (click)="onSave()" class="btn btn-primary" [disabled]="isSaving()">
          @if (isSaving()) {
            <div class="spinner"></div>
            <span>Guardando...</span>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <span>Guardar Permisos</span>
          }
        </button>
      </div>
    }
  </div>
</div>
